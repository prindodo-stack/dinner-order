<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>오늘 저녁 주문</title>
  <style>
*{box-sizing:border-box}
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#7a8496;--line:#e8ebf2;--primary:#5b5bd6;--primary2:#7474e8;--soft:#f1f1ff;--green:#25a56a;--red:#ef5b5b;--shadow:0 14px 35px rgba(30,41,59,.08)}
body{margin:0;font-family:Pretendard,"Noto Sans KR",Apple SD Gothic Neo,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f8f9fd 0,#f3f5fa 100%);color:var(--text)}
button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 22px 54px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.brand{display:flex;gap:13px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#8f7cf8);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 10px 24px rgba(91,91,214,.28)}
.brand h1{margin:0;font-size:27px;letter-spacing:-.7px}.brand p{margin:5px 0 0;color:var(--muted);font-size:14px}.admin-btn{border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:12px;font-weight:700;color:#4a5568;cursor:pointer}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:12px 14px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#5b5bd6 0,#766be7 55%,#8f7cf8 100%);border-radius:24px;padding:26px 28px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 38px rgba(91,91,214,.24);margin-bottom:22px}
.hero small{opacity:.8;font-weight:700}.hero h2{font-size:30px;margin:6px 0 7px}.hero p{margin:0;opacity:.85}.cutoff{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:16px 19px;border-radius:16px;text-align:center;min-width:138px}.cutoff span{font-size:12px;opacity:.8;display:block}.cutoff strong{display:block;font-size:24px;margin-top:3px}
.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card-title h3{margin:0;font-size:19px}.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#f4f5f8;color:#5b6474;font-weight:800}
.label{font-size:13px;font-weight:800;margin:14px 0 7px;display:block;color:#394150}.input{width:100%;padding:13px 14px;border:1px solid #dfe3ea;border-radius:13px;background:#fff;outline:none}.input:focus{border-color:#9ea2ff;box-shadow:0 0 0 4px #eeeeff}.optional{font-weight:500;color:#9aa2b1}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 16px}.choice{border:1px solid var(--line);background:#fff;padding:13px;border-radius:13px;font-weight:800;cursor:pointer}.choice.active{background:var(--soft);border-color:#b8b8ff;color:var(--primary)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu{border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.16s;background:#fff}.menu:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(30,41,59,.07)}.menu.selected{border-color:#a9a8ff;background:#f7f7ff;box-shadow:0 0 0 3px #ededff}.menu .name{font-weight:800}.menu .price{font-size:13px;color:var(--muted);margin-top:4px}
.submit{width:100%;margin-top:17px;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(91,91,214,.24)}.submit:disabled{opacity:.6;cursor:wait}.helper{color:#9aa2b1;font-size:12px;margin:10px 0 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat{background:#f8f9fc;border:1px solid var(--line);border-radius:15px;padding:13px;text-align:center}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}
.menu-summary{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.menu-chip{background:#f6f6ff;color:#5656c8;border:1px solid #e1e1ff;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}
.orders{display:flex;flex-direction:column;gap:2px}.order{display:grid;grid-template-columns:44px 88px 1fr auto;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #f0f2f6}.order:last-child{border-bottom:none}.avatar{width:36px;height:36px;border-radius:12px;background:#eef0ff;display:grid;place-items:center;font-weight:900;color:var(--primary)}.person{font-weight:800}.dish{font-size:14px}.note{font-size:12px;color:var(--muted);margin-top:3px}.state{font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px}.eat{background:#eaf8f1;color:#168255}.skip{background:#fff0f0;color:#d54c4c}.empty{padding:22px 0;color:#a0a7b5;text-align:center;font-size:14px}
.summary{margin-top:16px;background:#f8f9fc;border-radius:15px;padding:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line)}.summary span{color:var(--muted);font-size:13px}.summary strong{font-size:20px}
.admin-panel{margin-top:20px}.section-desc{margin:5px 0 0;color:var(--muted);font-size:13px}.admin-auth{max-width:260px}.pin-input{letter-spacing:.2em}.admin-grid{display:grid;grid-template-columns:1.5fr .7fr auto;gap:10px;align-items:end}.admin-apply{margin:0;height:47px;white-space:nowrap}
.admin-divider{height:1px;background:var(--line);margin:26px 0}.manage-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.manage-head h3{margin:0;font-size:18px}.manage-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.secondary-btn{border:1px solid #dfe3ea;background:#fff;color:#424b5d;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}
.restaurant-editor{display:grid;gap:14px}.restaurant-block{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fbfcff}.restaurant-row{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;align-items:center}.restaurant-row input,.menu-edit-row input{width:100%;border:1px solid #dfe3ea;border-radius:10px;padding:10px 11px;background:#fff}.restaurant-name{font-weight:800}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.mini-btn.save{color:var(--primary)}.mini-btn.danger{color:#c33;background:#fff7f7}.menu-editor{margin-top:12px;display:grid;gap:7px}.menu-edit-row{display:grid;grid-template-columns:1fr 130px auto auto;gap:7px;align-items:center}.add-menu-btn{margin-top:10px;border:0;background:#eef0ff;color:var(--primary);border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}
.notice{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 12px 26px rgba(0,0,0,.18);display:none;z-index:10}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr 1fr}.admin-apply{grid-column:1/-1}.restaurant-row{grid-template-columns:1fr 1fr}.restaurant-row .mini-btn{width:100%}}
@media(max-width:600px){.shell{padding:18px 13px 36px}.topbar{align-items:flex-start}.brand h1{font-size:22px}.logo{width:42px;height:42px}.hero{align-items:flex-start;padding:22px 20px}.hero h2{font-size:25px}.cutoff{min-width:104px;padding:12px}.menu-grid{grid-template-columns:1fr}.admin-grid,.restaurant-row,.menu-edit-row{grid-template-columns:1fr}.order{grid-template-columns:40px 74px 1fr}.state{grid-column:3}.admin-btn{padding:9px 11px;font-size:13px}.manage-head{align-items:flex-start;flex-direction:column}.secondary-btn{width:100%}}

</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🍚</div>
        <div><h1>오늘 저녁 주문</h1><p id="dateText">불러오는 중...</p></div>
      </div>
      <button class="admin-btn" id="adminToggle">⚙️ 밥 당번</button>
    </header>

    <div id="connectionBanner" class="banner hidden"></div>

    <section class="hero">
      <div><small>오늘의 식당</small><h2 id="restaurantName">불러오는 중...</h2><p id="restaurantDesc">Supabase에서 정보를 불러오고 있습니다.</p></div>
      <div class="cutoff"><span>주문 마감</span><strong id="cutoffView">--:--</strong></div>
    </section>

    <main class="layout">
      <section class="card">
        <div class="card-title"><h3>내 주문</h3><span class="pill" id="myState">미응답</span></div>
        <label class="label" for="nameInput">이름</label>
        <input class="input" id="nameInput" placeholder="이름을 입력하세요" maxlength="30" autocomplete="name">
        <div class="switch">
          <button class="choice active" id="eatBtn">🍽️ 먹을게요</button>
          <button class="choice" id="skipBtn">🙅 오늘은 안 먹어요</button>
        </div>
        <div id="menuArea">
          <label class="label">메뉴 선택</label>
          <div class="menu-grid" id="menuGrid"></div>
          <label class="label" for="noteInput">요청사항 <span class="optional">(선택)</span></label>
          <input class="input" id="noteInput" placeholder="예: 밥 조금, 맵지 않게" maxlength="100">
        </div>
        <button class="submit" id="saveBtn">주문 저장하기</button>
        <p class="helper">같은 이름의 주문은 최초 주문한 기기에서 수정할 수 있습니다.</p>
      </section>

      <section class="card">
        <div class="card-title"><h3>오늘 주문 현황</h3><span class="pill" id="respondCount">0명 응답</span></div>
        <div class="stats">
          <div class="stat"><strong id="eatCount">0</strong><span>식사</span></div>
          <div class="stat"><strong id="skipCount">0</strong><span>미식사</span></div>
          <div class="stat"><strong id="menuKinds">0</strong><span>메뉴 종류</span></div>
        </div>
        <div id="menuSummary" class="menu-summary"></div>
        <div class="orders" id="orders"><div class="empty">아직 주문이 없습니다.</div></div>
        <div class="summary"><span>예상 주문 금액</span><strong id="totalPrice">0원</strong></div>
      </section>
    </main>

    <section class="card admin-panel hidden" id="adminPanel">
      <div class="card-title">
        <div><h3>밥 당번 설정</h3><p class="section-desc">PIN 인증 후 오늘의 식당과 식당·메뉴를 관리할 수 있습니다.</p></div>
        <span class="pill">관리자</span>
      </div>

      <div class="admin-auth">
        <label class="label" for="pinInput">관리자 PIN</label>
        <input class="input pin-input" type="password" inputmode="numeric" id="pinInput" placeholder="PIN">
      </div>

      <div class="admin-grid">
        <div>
          <label class="label" for="restaurantSelect">오늘의 식당</label>
          <select class="input" id="restaurantSelect"></select>
        </div>
        <div>
          <label class="label" for="cutoffInput">주문 마감</label>
          <input class="input" type="time" id="cutoffInput" value="17:40">
        </div>
        <button class="submit admin-apply" id="applyBtn">오늘 식당 적용</button>
      </div>

      <div class="admin-divider"></div>

      <div class="manage-head">
        <div><h3>식당 및 메뉴 관리</h3><p>식당 이름, 설명, 메뉴명과 가격을 수정할 수 있습니다.</p></div>
        <button class="secondary-btn" id="addRestaurantBtn">+ 식당 추가</button>
      </div>

      <div id="restaurantEditor" class="restaurant-editor"></div>
    </section>
  </div>

  <div class="notice" id="notice"></div>
  <script type="module">
const SUPABASE_URL = "https://zyuybhszykxuafzriksn.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_3h3_2LRYgdyeXdoDO6XZMA_4jQrQTtV";
const API_URL = `${SUPABASE_URL}/functions/v1/meal-api`;

const $ = s => document.querySelector(s);
const state = { restaurants: [], menus: [], day: null, orders: [], selectedMenuId: null, willEat: true, loading: false };

function koreaDate(){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value; return `${get("year")}-${get("month")}-${get("day")}`;
}
function displayDate(){return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date())}
function money(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const el=$("#notice");el.textContent=msg;el.style.display="block";clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.style.display="none",2300)}
function adminPin(){return $("#pinInput").value.trim()}
function tokenFor(name){const key=`meal-token:${koreaDate()}:${name}`;let t=localStorage.getItem(key);if(!t){t=crypto.randomUUID();localStorage.setItem(key,t)}return t}
async function api(path="",options={}){
  const res=await fetch(API_URL+path,{...options,headers:{"apikey":PUBLISHABLE_KEY,"Content-Type":"application/json",...(options.headers||{})}});
  const data=await res.json().catch(()=>({})); if(!res.ok){const e=new Error(data.error||`HTTP ${res.status}`);e.status=res.status;throw e} return data;
}
function activeRestaurants(){return state.restaurants.filter(r=>r.active!==false)}
function activeMenus(){return state.menus.filter(m=>m.active!==false)}
function currentRestaurant(){return state.restaurants.find(r=>r.id===state.day?.restaurant_id)||null}
function currentMenus(){const r=currentRestaurant();return r?activeMenus().filter(m=>m.restaurant_id===r.id):[]}

function renderRestaurant(){
  const r=currentRestaurant();
  $("#restaurantName").textContent=r?r.name:"오늘의 식당 미지정";
  $("#restaurantDesc").textContent=r?r.description:"밥 당번이 오늘의 식당을 지정해 주세요.";
  $("#cutoffView").textContent=state.day?.cutoff_time?.slice(0,5)||"--:--";
  const grid=$("#menuGrid");grid.innerHTML="";
  const menus=currentMenus();
  if(!menus.length) grid.innerHTML='<div class="empty">선택할 수 있는 메뉴가 없습니다.</div>';
  else menus.forEach(m=>{const el=document.createElement("div");el.className="menu"+(state.selectedMenuId===m.id?" selected":"");el.innerHTML=`<div class="name">${escapeHtml(m.name)}</div><div class="price">${money(m.price)}</div>`;el.onclick=()=>{state.selectedMenuId=m.id;renderRestaurant()};grid.appendChild(el)});
  $("#restaurantSelect").innerHTML=activeRestaurants().map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join("");
  if(state.day?.restaurant_id) $("#restaurantSelect").value=state.day.restaurant_id;
  if(state.day?.cutoff_time) $("#cutoffInput").value=state.day.cutoff_time.slice(0,5);
}
function renderOrders(){
  const map=new Map(state.menus.map(m=>[m.id,m])),eaters=state.orders.filter(o=>o.will_eat),skippers=state.orders.filter(o=>!o.will_eat);
  $("#respondCount").textContent=`${state.orders.length}명 응답`;$("#eatCount").textContent=eaters.length;$("#skipCount").textContent=skippers.length;
  const counts={};eaters.forEach(o=>{const n=map.get(o.menu_id)?.name||"메뉴";counts[n]=(counts[n]||0)+1});$("#menuKinds").textContent=Object.keys(counts).length;
  $("#menuSummary").innerHTML=Object.entries(counts).map(([n,c])=>`<span class="menu-chip">${escapeHtml(n)} × ${c}</span>`).join("");
  $("#totalPrice").textContent=money(eaters.reduce((s,o)=>s+(map.get(o.menu_id)?.price||0),0));
  const wrap=$("#orders");wrap.innerHTML="";
  if(!state.orders.length){wrap.innerHTML='<div class="empty">아직 주문이 없습니다.</div>';return}
  state.orders.forEach(o=>{const menu=map.get(o.menu_id),row=document.createElement("div");row.className="order";row.innerHTML=`<div class="avatar">${escapeHtml(o.member_name.slice(0,1))}</div><div class="person">${escapeHtml(o.member_name)}</div><div>${o.will_eat?`<div class="dish">${escapeHtml(menu?.name||"메뉴")}</div>${o.note?`<div class="note">${escapeHtml(o.note)}</div>`:""}`:'<div class="dish" style="color:#d54c4c">오늘은 안 먹음</div>'}</div><div class="state ${o.will_eat?"eat":"skip"}">${o.will_eat?"주문":"미식사"}</div>`;wrap.appendChild(row)});
}
function renderEditor(){
  const wrap=$("#restaurantEditor");
  if(!wrap) return;
  wrap.innerHTML="";
  activeRestaurants().forEach(r=>{
    const menus=activeMenus().filter(m=>m.restaurant_id===r.id);
    const box=document.createElement("div");box.className="restaurant-block";
    box.innerHTML=`
      <div class="restaurant-row">
        <input class="restaurant-name" data-rname="${r.id}" value="${escapeHtml(r.name)}" placeholder="식당 이름">
        <input data-rdesc="${r.id}" value="${escapeHtml(r.description||"")}" placeholder="식당 설명">
        <button class="mini-btn save" data-rsave="${r.id}">저장</button>
        <button class="mini-btn danger" data-rdelete="${r.id}">삭제</button>
      </div>
      <div class="menu-editor">
        ${menus.map(m=>`<div class="menu-edit-row">
          <input data-mname="${m.id}" value="${escapeHtml(m.name)}" placeholder="메뉴명">
          <input data-mprice="${m.id}" type="number" min="0" step="500" value="${m.price}" placeholder="가격">
          <button class="mini-btn save" data-msave="${m.id}">저장</button>
          <button class="mini-btn danger" data-mdelete="${m.id}">삭제</button>
        </div>`).join("")}
      </div>
      <button class="add-menu-btn" data-madd="${r.id}">+ 메뉴 추가</button>`;
    wrap.appendChild(box);
  });
}
async function refresh(silent=false){
  try{const data=await api(`?date=${encodeURIComponent(koreaDate())}`);state.restaurants=data.restaurants||[];state.menus=data.menus||[];state.day=data.day||null;state.orders=data.orders||[];renderRestaurant();renderOrders();renderEditor();$("#connectionBanner").classList.add("hidden")}
  catch(e){$("#connectionBanner").textContent=`데이터 연결 오류: ${e.message}`;$("#connectionBanner").classList.remove("hidden");if(!silent)toast("Supabase 연결을 확인해 주세요.")}
}
async function adminAction(payload,success){
  const pin=adminPin();if(!pin)return toast("관리자 PIN을 입력해 주세요.");
  try{await api("",{method:"POST",body:JSON.stringify({...payload,pin})});toast(success);await refresh(true);return true}
  catch(e){toast(e.message==="invalid_admin_pin"?"관리자 PIN이 올바르지 않습니다.":`처리 실패: ${e.message}`);return false}
}

$("#eatBtn").onclick=()=>{state.willEat=true;$("#eatBtn").classList.add("active");$("#skipBtn").classList.remove("active");$("#menuArea").classList.remove("hidden")};
$("#skipBtn").onclick=()=>{state.willEat=false;$("#skipBtn").classList.add("active");$("#eatBtn").classList.remove("active");$("#menuArea").classList.add("hidden")};
$("#saveBtn").onclick=async()=>{
  if(state.loading)return;const name=$("#nameInput").value.trim();if(!name)return toast("이름을 입력해 주세요.");if(!state.day)return toast("오늘의 식당이 아직 지정되지 않았습니다.");if(state.willEat&&!state.selectedMenuId)return toast("메뉴를 선택해 주세요.");
  const btn=$("#saveBtn");state.loading=true;btn.disabled=true;btn.textContent="저장 중...";
  try{await api("",{method:"POST",body:JSON.stringify({action:"submit_order",date:koreaDate(),name,will_eat:state.willEat,menu_id:state.willEat?state.selectedMenuId:null,note:$("#noteInput").value.trim(),token:tokenFor(name)})});localStorage.setItem("meal-last-name",name);$("#myState").textContent="저장됨";toast("주문이 저장되었습니다.");await refresh(true)}
  catch(e){toast((e.status===409||e.message==="name_already_used")?"같은 이름으로 이미 다른 기기에서 주문했습니다.":`저장 실패: ${e.message}`)}
  finally{state.loading=false;btn.disabled=false;btn.textContent="주문 저장하기"}
};
if($("#adminToggle")) $("#adminToggle").onclick=()=>$("#adminPanel")?.classList.toggle("hidden");
if($("#applyBtn")) $("#applyBtn").onclick=async()=>{const ok=await adminAction({action:"admin_set_day",date:koreaDate(),restaurant_id:$("#restaurantSelect").value,cutoff_time:$("#cutoffInput").value||"17:40"},"오늘의 식당을 변경했습니다.");if(ok)state.selectedMenuId=null};
if($("#addRestaurantBtn")) $("#addRestaurantBtn").onclick=async()=>{const name=prompt("추가할 식당 이름을 입력하세요.");if(!name)return;const desc=prompt("식당 설명을 입력하세요. (선택)")||"";await adminAction({action:"admin_add_restaurant",name,description:desc},"식당을 추가했습니다.")};

if($("#restaurantEditor")) $("#restaurantEditor").addEventListener("click",async e=>{
  const t=e.target;
  if(t.dataset.rsave){const id=t.dataset.rsave;const name=document.querySelector(`[data-rname="${id}"]`).value.trim();const description=document.querySelector(`[data-rdesc="${id}"]`).value.trim();await adminAction({action:"admin_update_restaurant",id,name,description},"식당 정보를 저장했습니다.")}
  if(t.dataset.rdelete){if(!confirm("이 식당을 삭제할까요? 과거 주문에 사용된 식당은 비활성화됩니다."))return;await adminAction({action:"admin_delete_restaurant",id:t.dataset.rdelete},"식당을 삭제했습니다.")}
  if(t.dataset.msave){const id=t.dataset.msave;const name=document.querySelector(`[data-mname="${id}"]`).value.trim();const price=Number(document.querySelector(`[data-mprice="${id}"]`).value||0);await adminAction({action:"admin_update_menu",id,name,price},"메뉴를 저장했습니다.")}
  if(t.dataset.mdelete){if(!confirm("이 메뉴를 삭제할까요? 과거 주문에 사용된 메뉴는 비활성화됩니다."))return;await adminAction({action:"admin_delete_menu",id:t.dataset.mdelete},"메뉴를 삭제했습니다.")}
  if(t.dataset.madd){const name=prompt("추가할 메뉴 이름을 입력하세요.");if(!name)return;const price=Number(prompt("가격을 숫자로 입력하세요.","9000")||0);await adminAction({action:"admin_add_menu",restaurant_id:t.dataset.madd,name,price},"메뉴를 추가했습니다.")}
});

$("#dateText").textContent=displayDate();const lastName=localStorage.getItem("meal-last-name");if(lastName)$("#nameInput").value=lastName;
await refresh();setInterval(()=>refresh(true),5000);

</script>
</body>
</html>
