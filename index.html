<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#293681">
<title>오늘 주문</title>
<style>
*{box-sizing:border-box}
:root{--navy:#293681;--blue:#4274D9;--aqua:#95CCDD;--mint:#D0E7E6;--bg:#f4f8f9;--card:#fff;--text:#24314f;--muted:#718096;--line:#d8e4e8;--ok:#218a67;--bad:#c94f5a}
body{margin:0;background:linear-gradient(180deg,#f9fbfc 0,#eef5f6 100%);color:var(--text);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}.shell{max-width:1120px;margin:auto;padding:20px 18px 48px}.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--blue));display:grid;place-items:center;font-size:24px;box-shadow:0 10px 22px rgba(41,54,129,.2)}.brand h1{margin:0;color:var(--navy);font-size:27px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:850;cursor:pointer}.btn-light{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn-primary{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.btn-danger{background:#fff0f1;color:#bd3f4b;border:1px solid #ffd2d6}.btn-wide{width:100%}
.banner{background:#eef7f8;border:1px solid var(--aqua);color:var(--navy);padding:12px 14px;border-radius:14px;margin-bottom:13px}
.slotbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.slot{border:1px solid var(--line);border-radius:17px;padding:14px 15px;cursor:pointer;text-align:left;transition:.15s}.slot[data-slot="1"]{background:linear-gradient(135deg,#f1f8f7,#D0E7E6)}.slot[data-slot="2"]{background:linear-gradient(135deg,#f3f6ff,#e8efff)}.slot.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(149,204,221,.28),0 8px 18px rgba(41,54,129,.08)}.slot small{display:block;color:var(--muted);font-weight:800}.slot strong{display:block;color:var(--navy);font-size:18px;margin-top:3px}.slot span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue) 65%,var(--aqua));color:#fff;border-radius:23px;padding:23px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 18px 36px rgba(41,54,129,.18);margin-bottom:18px}.hero small{font-weight:800;opacity:.82}.hero h2{font-size:29px;margin:5px 0}.hero p{margin:0;opacity:.87}.cutoff{min-width:112px;padding:12px;background:rgba(255,255,255,.14);border:1px solid rgba(208,231,230,.5);border-radius:15px;text-align:center}.cutoff span{font-size:12px;display:block;opacity:.82}.cutoff strong{font-size:23px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:20px;box-shadow:0 12px 28px rgba(36,49,79,.06)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h3{margin:0;color:var(--navy);font-size:19px}.pill{font-size:12px;font-weight:850;padding:6px 9px;border-radius:999px;background:var(--mint);color:var(--navy)}
.label{display:block;font-size:13px;font-weight:850;margin:13px 0 7px;color:#384563}.member-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.member{min-height:50px;border:1px solid var(--line);background:#fff;border-radius:13px;font-weight:850;color:#34405d;cursor:pointer}.member.active{border-color:var(--blue);background:var(--mint);color:var(--navy);box-shadow:0 0 0 3px rgba(149,204,221,.25)}.member.ordered:after{content:" ✓";color:var(--ok)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.choice{min-height:47px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:850;color:#45506a;cursor:pointer}.choice.active{background:var(--mint);border-color:var(--blue);color:var(--navy)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}.menu.active{border-color:var(--blue);background:#f2f8fa;box-shadow:0 0 0 3px rgba(149,204,221,.25)}.menu b{display:block;color:#2c3858}.menu span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.input{width:100%;border:1px solid #d9e1e5;border-radius:12px;padding:11px 12px;background:#fff;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(149,204,221,.25)}.save-order{margin-top:15px;min-height:49px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.stat{background:#f7fafb;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.stat strong{display:block;color:var(--navy);font-size:20px}.stat span{font-size:12px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--mint);color:var(--navy);font-size:12px;font-weight:850;padding:6px 8px;border-radius:999px}
.order{display:grid;grid-template-columns:36px 80px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f3}.avatar{width:33px;height:33px;border-radius:10px;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-weight:900}.person{font-weight:850}.dish{font-size:14px}.note{font-size:12px;color:var(--muted);margin-top:2px}.status{font-size:11px;font-weight:900;padding:5px 7px;border-radius:999px}.eat{background:#e8f7f0;color:#167b58}.skip{background:#fff0f1;color:#c24854}.total{display:flex;justify-content:space-between;align-items:center;margin-top:13px;background:#f7fafb;border:1px solid var(--line);border-radius:13px;padding:12px}.total span{font-size:13px;color:var(--muted)}.total strong{font-size:19px;color:var(--navy)}
.admin{margin-top:18px}.admin-status{display:flex;gap:7px;align-items:center}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.slot-admin{border:1px solid var(--line);border-radius:16px;padding:13px;background:#f9fbfc}.slot-admin h4{margin:0 0 10px;color:var(--navy)}.slot-admin-row{display:grid;grid-template-columns:1fr 120px auto;gap:7px;align-items:end}.divider{height:1px;background:var(--line);margin:22px 0}.manage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.manage-head h3{margin:0;color:var(--navy);font-size:18px}.manage-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.danger-zone{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.member-admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.member-admin{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:#f8fbfc;border:1px solid var(--line);border-radius:12px;padding:7px}.member-admin input{min-width:0;border:0;background:transparent;outline:none;font-weight:800;color:#34405d}.mini{padding:8px 9px;border-radius:9px;font-size:12px}
.restaurant-block{border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px;background:#f9fbfc}.restaurant-row{display:grid;grid-template-columns:1fr 1.3fr auto auto;gap:7px}.menu-edit{display:grid;grid-template-columns:1fr 105px auto auto;gap:7px;margin-top:7px}.addline{margin-top:8px}.empty{padding:17px 0;text-align:center;color:#98a2b1;font-size:13px}.toast{position:fixed;right:18px;bottom:18px;background:#17223c;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:30;box-shadow:0 12px 28px rgba(0,0,0,.2)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.member-admin-grid{grid-template-columns:1fr 1fr}.restaurant-row{grid-template-columns:1fr 1fr}.menu-edit{grid-template-columns:1fr 100px auto}.slot-admin-row{grid-template-columns:1fr 120px}}
@media(max-width:560px){.shell{padding:13px 11px 32px}.top{align-items:flex-start}.logo{width:42px;height:42px;border-radius:14px}.brand h1{font-size:21px}.brand p{font-size:12px}.btn-light{padding:9px 10px;font-size:13px}.slotbar{gap:7px}.slot{padding:11px;border-radius:14px}.slot strong{font-size:15px}.hero{padding:18px 16px;border-radius:19px}.hero h2{font-size:23px}.hero p{font-size:12px}.cutoff{min-width:88px;padding:9px}.cutoff strong{font-size:19px}.card{padding:15px;border-radius:17px}.member-grid{grid-template-columns:repeat(2,1fr)}.member{min-height:48px}.menu-grid{grid-template-columns:1fr}.order{grid-template-columns:33px 68px 1fr}.order .status{grid-column:3;justify-self:start}.member-admin-grid{grid-template-columns:1fr}.restaurant-row,.menu-edit,.slot-admin-row{grid-template-columns:1fr}.manage-head{align-items:flex-start;flex-direction:column}.manage-head .btn{width:100%}.danger-zone{display:block}.danger-zone .btn{width:100%}.toast{left:11px;right:11px;bottom:11px;text-align:center}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo">🍚</div><div><h1>오늘 주문</h1><p id="dateText"></p></div></div>
  <button class="btn btn-light" id="adminToggle">⚙️ 밥 당번</button>
</header>

<div id="banner" class="banner hidden"></div>

<div class="slotbar" id="slotBar">
  <button class="slot active" data-slot="1"><small>주문 1</small><strong id="slotName1">불러오는 중</strong><span id="slotTime1">--:-- 마감</span></button>
  <button class="slot hidden" id="slot2Button" data-slot="2"><small>주문 2</small><strong id="slotName2">불러오는 중</strong><span id="slotTime2">--:-- 마감</span></button>
</div>

<section class="hero">
  <div><small id="heroSlotLabel">주문 1</small><h2 id="restaurantName">불러오는 중...</h2><p id="restaurantDesc"></p></div>
  <div class="cutoff"><span>주문 마감</span><strong id="cutoffView">--:--</strong></div>
</section>

<main class="grid">
<section class="card">
  <div class="head"><h3>내 주문</h3><span class="pill" id="myState">이름 선택</span></div>
  <label class="label">① 내 이름 선택</label>
  <div id="memberGrid" class="member-grid"><div class="empty">등록된 사용자가 없습니다.</div></div>
  <div class="switch">
    <button class="choice active" id="eatBtn">🍽️ 주문할게요</button>
    <button class="choice" id="skipBtn">🙅 주문 안 해요</button>
  </div>
  <div id="menuArea">
    <label class="label">② 메뉴 선택</label>
    <div id="menuGrid" class="menu-grid"></div>
    <label class="label">요청사항 <span style="font-weight:500;color:#98a2b1">(선택)</span></label>
    <input class="input" id="noteInput" maxlength="100" placeholder="예: 곱빼기, 맵지 않게, 밥 조금">
  </div>
  <button class="btn btn-primary btn-wide save-order" id="saveBtn">주문 저장하기</button>
</section>

<section class="card">
  <div class="head"><h3>현재 주문 현황</h3><span class="pill" id="respondCount">0명 응답</span></div>
  <div class="stats"><div class="stat"><strong id="eatCount">0</strong><span>주문</span></div><div class="stat"><strong id="skipCount">0</strong><span>미주문</span></div><div class="stat"><strong id="menuKinds">0</strong><span>메뉴 종류</span></div></div>
  <div class="chips" id="menuSummary"></div>
  <div id="orders"></div>
  <div class="total"><span>예상 주문 금액</span><strong id="totalPrice">0원</strong></div>
</section>
</main>

<section class="card admin hidden" id="adminPanel">
  <div class="head">
    <div><h3>밥 당번 관리</h3><p style="margin:4px 0 0;color:var(--muted);font-size:13px">입장 시 PIN 인증 후에는 이 화면에서 다시 입력하지 않습니다.</p></div>
    <div class="admin-status"><span class="pill">인증됨</span><button class="btn btn-light mini" id="adminLogout">나가기</button></div>
  </div>

  <div class="admin-grid">
    <div class="slot-admin">
      <h4>주문 1 설정</h4>
      <div class="slot-admin-row">
        <div><label class="label">식당/매장</label><select class="input" id="restaurantSelect1"></select></div>
        <div><label class="label">마감</label><input class="input" id="cutoffInput1" type="time" value="17:40"></div>
        <button class="btn btn-primary" data-apply-slot="1">적용</button>
      </div>
    </div>
    <div class="slot-admin">
      <h4>주문 2 설정</h4>
      <p style="margin:-3px 0 10px;color:var(--muted);font-size:12px">필요한 날에만 켜서 두 번째 주문을 진행합니다.</p>
      <div class="slot-admin-row">
        <div><label class="label">식당/매장</label><select class="input" id="restaurantSelect2"></select></div>
        <div><label class="label">마감</label><input class="input" id="cutoffInput2" type="time" value="16:30"></div>
        <button class="btn btn-primary" data-apply-slot="2">주문 2 사용</button>
      </div>
      <button class="btn btn-light btn-wide" style="margin-top:8px" id="disableSlot2Btn">주문 2 사용 안 함</button>
    </div>
  </div>

  <div class="danger-zone">
    <button class="btn btn-danger" id="resetOrdersBtn">🗑️ 오늘 전체 주문 초기화</button>
  </div>

  <div class="divider"></div>
  <div class="manage-head"><div><h3>사용자 관리</h3><p>사용자는 주문 화면에서 이름 버튼만 선택합니다.</p></div><button class="btn btn-light" id="addMemberBtn">+ 사용자 추가</button></div>
  <div id="memberAdminGrid" class="member-admin-grid"></div>

  <div class="divider"></div>
  <div class="manage-head"><div><h3>식당 및 메뉴 관리</h3><p>식당·커피숍 이름, 설명, 메뉴명과 가격을 관리합니다.</p></div><button class="btn btn-light" id="addRestaurantBtn">+ 매장 추가</button></div>
  <div id="restaurantEditor"></div>
</section>
</div>
<div id="toast" class="toast"></div>

<script type="module">
const SUPABASE_URL="https://zyuybhszykxuafzriksn.supabase.co";
const KEY="sb_publishable_3h3_2LRYgdyeXdoDO6XZMA_4jQrQTtV";
const API=`${SUPABASE_URL}/functions/v1/meal-api`;
const $=s=>document.querySelector(s);
const st={restaurants:[],menus:[],members:[],days:[],orders:[],slot:1,member:null,menu:{1:null,2:null},eat:{1:true,2:true}};
let adminSessionPin=null;

function dateKey(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t)?.value;return `${g("year")}-${g("month")}-${g("day")}`}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",2300)}
function token(name,slot){const k=`meal-token:${dateKey()}:${slot}:${name}`;let v=localStorage.getItem(k);if(!v){v=crypto.randomUUID();localStorage.setItem(k,v)}return v}
async function api(body=null){const isGet=!body;const r=await fetch(isGet?API+`?date=${dateKey()}`:API,{method:isGet?"GET":"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:isGet?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||"오류");e.status=r.status;throw e}return d}
const activeR=()=>st.restaurants.filter(x=>x.active!==false), activeM=()=>st.menus.filter(x=>x.active!==false), activeU=()=>st.members.filter(x=>x.active!==false);
const day=s=>st.days.find(x=>Number(x.order_slot)===Number(s))||null;
const restaurant=s=>st.restaurants.find(x=>x.id===day(s)?.restaurant_id)||null;
const slotOrders=s=>st.orders.filter(x=>Number(x.order_slot)===Number(s));

function syncExisting(){
  if(!st.member)return;
  const o=slotOrders(st.slot).find(x=>x.member_name===st.member);
  if(o){st.eat[st.slot]=!!o.will_eat;st.menu[st.slot]=o.menu_id||null;$("#noteInput").value=o.note||""}
  else{$("#noteInput").value="";st.menu[st.slot]=null;st.eat[st.slot]=true}
  updateEatUI();
}
function updateEatUI(){const eat=st.eat[st.slot];$("#eatBtn").classList.toggle("active",eat);$("#skipBtn").classList.toggle("active",!eat);$("#menuArea").classList.toggle("hidden",!eat)}

function render(){
  [1,2].forEach(s=>{const r=restaurant(s),d=day(s);$("#slotName"+s).textContent=r?.name||"미설정";$("#slotTime"+s).textContent=(d?.cutoff_time?.slice(0,5)||"--:--")+" 마감";document.querySelector(`[data-slot="${s}"]`)?.classList.toggle("active",st.slot===s)});
  $("#slot2Button").classList.toggle("hidden",!day(2));
  if(st.slot===2 && !day(2)) st.slot=1;
  const r=restaurant(st.slot),d=day(st.slot);$("#heroSlotLabel").textContent="주문 "+st.slot;$("#restaurantName").textContent=r?.name||"매장 미지정";$("#restaurantDesc").textContent=r?.description||"밥 당번이 이 주문의 매장을 지정해 주세요.";$("#cutoffView").textContent=d?.cutoff_time?.slice(0,5)||"--:--";

  const ordered=new Set(slotOrders(st.slot).map(o=>o.member_name));
  $("#memberGrid").innerHTML=activeU().length?activeU().map(u=>`<button class="member ${st.member===u.name?"active":""} ${ordered.has(u.name)?"ordered":""}" data-member="${esc(u.name)}">${esc(u.name)}</button>`).join(""):'<div class="empty">밥 당번이 사용자를 등록해 주세요.</div>';

  const menus=r?activeM().filter(m=>m.restaurant_id===r.id):[];
  $("#menuGrid").innerHTML=menus.length?menus.map(m=>`<button class="menu ${st.menu[st.slot]===m.id?"active":""}" data-menu="${m.id}"><b>${esc(m.name)}</b><span>${money(m.price)}</span></button>`).join(""):'<div class="empty">메뉴가 없습니다.</div>';
  $("#myState").textContent=st.member?st.member:"이름 선택";
  updateEatUI();renderOrders();renderAdmin();
}

function renderOrders(){
  const list=slotOrders(st.slot),mm=new Map(st.menus.map(m=>[m.id,m])),e=list.filter(o=>o.will_eat),s=list.filter(o=>!o.will_eat),cnt={};
  e.forEach(o=>{const n=mm.get(o.menu_id)?.name||"메뉴";cnt[n]=(cnt[n]||0)+1});
  $("#respondCount").textContent=list.length+"명 응답";$("#eatCount").textContent=e.length;$("#skipCount").textContent=s.length;$("#menuKinds").textContent=Object.keys(cnt).length;
  $("#menuSummary").innerHTML=Object.entries(cnt).map(([n,c])=>`<span class="chip">${esc(n)} × ${c}</span>`).join("");
  $("#totalPrice").textContent=money(e.reduce((a,o)=>a+(mm.get(o.menu_id)?.price||0),0));
  $("#orders").innerHTML=list.length?list.map(o=>{const m=mm.get(o.menu_id);return `<div class="order"><div class="avatar">${esc(o.member_name.slice(0,1))}</div><div class="person">${esc(o.member_name)}</div><div>${o.will_eat?`<div class="dish">${esc(m?.name||"메뉴")}</div>${o.note?`<div class="note">${esc(o.note)}</div>`:""}`:'<div class="dish" style="color:#c24854">주문 안 함</div>'}</div><span class="status ${o.will_eat?"eat":"skip"}">${o.will_eat?"주문":"미주문"}</span></div>`}).join(""):'<div class="empty">아직 주문이 없습니다.</div>';
}

function renderAdmin(){
  const opts=activeR().map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  [1,2].forEach(s=>{const sel=$("#restaurantSelect"+s);sel.innerHTML=opts;const d=day(s);if(d?.restaurant_id)sel.value=d.restaurant_id;if(d?.cutoff_time)$("#cutoffInput"+s).value=d.cutoff_time.slice(0,5)});
  $("#memberAdminGrid").innerHTML=activeU().map(u=>`<div class="member-admin"><input data-uname="${u.id}" value="${esc(u.name)}"><button class="btn btn-light mini" data-usave="${u.id}">저장</button><button class="btn btn-danger mini" data-udel="${u.id}">삭제</button></div>`).join("")||'<div class="empty">등록된 사용자가 없습니다.</div>';
  $("#restaurantEditor").innerHTML=activeR().map(r=>{const ms=activeM().filter(m=>m.restaurant_id===r.id);return `<div class="restaurant-block"><div class="restaurant-row"><input class="input" data-rname="${r.id}" value="${esc(r.name)}"><input class="input" data-rdesc="${r.id}" value="${esc(r.description||"")}" placeholder="설명"><button class="btn btn-light mini" data-rsave="${r.id}">저장</button><button class="btn btn-danger mini" data-rdel="${r.id}">삭제</button></div>${ms.map(m=>`<div class="menu-edit"><input class="input" data-mname="${m.id}" value="${esc(m.name)}"><input class="input" data-mprice="${m.id}" type="number" value="${m.price}"><button class="btn btn-light mini" data-msave="${m.id}">저장</button><button class="btn btn-danger mini" data-mdel="${m.id}">삭제</button></div>`).join("")}<button class="btn btn-light mini addline" data-madd="${r.id}">+ 메뉴 추가</button></div>`}).join("");
}

async function refresh(silent=false){try{const d=await api();Object.assign(st,{restaurants:d.restaurants||[],menus:d.menus||[],members:d.members||[],days:d.days||[],orders:d.orders||[]});if(st.member&&!activeU().some(u=>u.name===st.member))st.member=null;render();$("#banner").classList.add("hidden")}catch(e){$("#banner").textContent="데이터 연결 오류: "+e.message;$("#banner").classList.remove("hidden");if(!silent)toast("데이터 연결을 확인해 주세요.")}}
async function admin(body,msg){if(!adminSessionPin)return toast("관리자 인증이 필요합니다.");try{await api({...body,pin:adminSessionPin});toast(msg);await refresh(true);return true}catch(e){if(e.message==="invalid_admin_pin"){adminSessionPin=null;$("#adminPanel").classList.add("hidden");toast("인증이 만료되었습니다. 다시 입장해 주세요.")}else toast(e.message==="member_name_exists"?"이미 등록된 이름입니다.":"처리 실패: "+e.message);return false}}

$("#slotBar").onclick=e=>{const b=e.target.closest("[data-slot]");if(!b)return;st.slot=Number(b.dataset.slot);syncExisting();render()};
$("#memberGrid").onclick=e=>{const b=e.target.closest("[data-member]");if(!b)return;st.member=b.dataset.member;localStorage.setItem("meal-last-member",st.member);syncExisting();render()};
$("#menuGrid").onclick=e=>{const b=e.target.closest("[data-menu]");if(!b)return;st.menu[st.slot]=b.dataset.menu;render()};
$("#eatBtn").onclick=()=>{st.eat[st.slot]=true;updateEatUI()};
$("#skipBtn").onclick=()=>{st.eat[st.slot]=false;updateEatUI()};
$("#saveBtn").onclick=async()=>{if(!st.member)return toast("먼저 내 이름을 선택해 주세요.");if(!day(st.slot))return toast("이 주문은 아직 설정되지 않았습니다.");if(st.eat[st.slot]&&!st.menu[st.slot])return toast("메뉴를 선택해 주세요.");try{await api({action:"submit_order",date:dateKey(),order_slot:st.slot,name:st.member,will_eat:st.eat[st.slot],menu_id:st.eat[st.slot]?st.menu[st.slot]:null,note:$("#noteInput").value.trim(),token:token(st.member,st.slot)});toast("주문 "+st.slot+"이 저장되었습니다.");await refresh(true)}catch(e){toast(e.status===409?"같은 이름의 주문이 다른 기기에서 이미 등록되었습니다.":"저장 실패: "+e.message)}};

$("#adminToggle").onclick=async()=>{if(adminSessionPin){$("#adminPanel").classList.toggle("hidden");return}const p=prompt("밥 당번 관리자 PIN을 입력하세요.");if(!p)return;try{await api({action:"admin_login",pin:p});adminSessionPin=p;$("#adminPanel").classList.remove("hidden");toast("관리자 인증이 완료되었습니다.")}catch(e){toast("PIN이 올바르지 않습니다.")}};
$("#adminLogout").onclick=()=>{adminSessionPin=null;$("#adminPanel").classList.add("hidden");toast("관리자 화면에서 나왔습니다.")};
document.querySelectorAll("[data-apply-slot]").forEach(b=>b.onclick=()=>{const s=Number(b.dataset.applySlot);admin({action:"admin_set_day",date:dateKey(),order_slot:s,restaurant_id:$("#restaurantSelect"+s).value,cutoff_time:$("#cutoffInput"+s).value||"17:40"},s===2?"주문 2를 사용하도록 설정했습니다.":"주문 1 설정을 적용했습니다.")});
$("#disableSlot2Btn").onclick=async()=>{if(!day(2))return toast("현재 주문 2는 사용하지 않고 있습니다.");if(!confirm("주문 2를 사용하지 않도록 할까요? 오늘의 주문 2 응답도 함께 삭제됩니다."))return;if(await admin({action:"admin_disable_slot",date:dateKey(),order_slot:2},"주문 2를 숨겼습니다.")){st.slot=1;st.menu[2]=null}};
$("#resetOrdersBtn").onclick=async()=>{if(!confirm("오늘의 주문 1·주문 2 응답을 모두 초기화할까요? 이 작업은 되돌릴 수 없습니다."))return;if(await admin({action:"admin_reset_orders",date:dateKey()},"오늘 전체 주문을 초기화했습니다.")){st.menu={1:null,2:null};$("#noteInput").value=""}};
$("#addMemberBtn").onclick=async()=>{const n=prompt("추가할 사용자 이름을 입력하세요.");if(n)await admin({action:"admin_add_member",name:n},"사용자를 추가했습니다.")};
$("#addRestaurantBtn").onclick=async()=>{const n=prompt("추가할 식당/커피숍 이름을 입력하세요.");if(!n)return;const d=prompt("설명을 입력하세요.")||"";await admin({action:"admin_add_restaurant",name:n,description:d},"매장을 추가했습니다.")};

$("#memberAdminGrid").onclick=async e=>{const t=e.target;if(t.dataset.usave){const id=t.dataset.usave,n=document.querySelector(`[data-uname="${id}"]`).value.trim();await admin({action:"admin_update_member",id,name:n},"사용자 이름을 저장했습니다.")}if(t.dataset.udel&&confirm("이 사용자를 목록에서 삭제할까요?"))await admin({action:"admin_delete_member",id:t.dataset.udel},"사용자를 삭제했습니다.")};
$("#restaurantEditor").onclick=async e=>{const t=e.target;if(t.dataset.rsave){const id=t.dataset.rsave;await admin({action:"admin_update_restaurant",id,name:document.querySelector(`[data-rname="${id}"]`).value.trim(),description:document.querySelector(`[data-rdesc="${id}"]`).value.trim()},"매장 정보를 저장했습니다.")}if(t.dataset.rdel&&confirm("이 매장을 삭제할까요?"))await admin({action:"admin_delete_restaurant",id:t.dataset.rdel},"매장을 삭제했습니다.");if(t.dataset.msave){const id=t.dataset.msave;await admin({action:"admin_update_menu",id,name:document.querySelector(`[data-mname="${id}"]`).value.trim(),price:Number(document.querySelector(`[data-mprice="${id}"]`).value||0)},"메뉴를 저장했습니다.")}if(t.dataset.mdel&&confirm("이 메뉴를 삭제할까요?"))await admin({action:"admin_delete_menu",id:t.dataset.mdel},"메뉴를 삭제했습니다.");if(t.dataset.madd){const n=prompt("메뉴 이름을 입력하세요.");if(!n)return;const p=Number(prompt("가격을 입력하세요.","4500")||0);await admin({action:"admin_add_menu",restaurant_id:t.dataset.madd,name:n,price:p},"메뉴를 추가했습니다.")}};
$("#dateText").textContent=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
st.member=localStorage.getItem("meal-last-member")||null;
await refresh();
if(st.member)syncExisting();
setInterval(()=>refresh(true),5000);
</script>
</body>
</html>
