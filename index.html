<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#635bdf">
<title>오늘 저녁 주문</title>
<style>
*{box-sizing:border-box} :root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#7b8497;--line:#e7e9f0;--p:#635bdf;--p2:#8474ef;--soft:#f0efff;--ok:#198754;--bad:#d94b4b}
body{margin:0;background:linear-gradient(#f9faff,#f3f5fa);color:var(--text);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}.shell{max-width:1120px;margin:auto;padding:22px 18px 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--p2));font-size:24px;box-shadow:0 10px 24px #635bdf33}.brand h1{margin:0;font-size:27px}.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:800;cursor:pointer}.btn-light{background:#fff;border:1px solid var(--line);color:#465064}.btn-primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.btn-danger{background:#fff0f0;color:#c43f3f;border:1px solid #ffd7d7}
.banner{background:#fff6e9;border:1px solid #ffd69d;color:#9a531d;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#5e58d8,#8a73ee);color:#fff;border-radius:24px;padding:25px 27px;display:flex;justify-content:space-between;gap:16px;align-items:center;box-shadow:0 18px 38px #635bdf30;margin-bottom:18px}.hero small{font-weight:800;opacity:.8}.hero h2{font-size:30px;margin:6px 0}.hero p{margin:0;opacity:.86}.cutoff{min-width:118px;text-align:center;background:#ffffff18;border:1px solid #ffffff35;border-radius:16px;padding:13px}.cutoff span{font-size:12px;display:block;opacity:.8}.cutoff strong{font-size:24px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:21px;box-shadow:0 12px 30px #1f293710}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.head h3{margin:0;font-size:19px}.pill{font-size:12px;font-weight:800;background:#f3f4f7;color:#5d6677;padding:6px 9px;border-radius:999px}
.label{display:block;font-size:13px;font-weight:850;margin:14px 0 8px}.member-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.member{min-height:52px;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:850;cursor:pointer;padding:10px}.member.active{border-color:#a9a4ff;background:var(--soft);color:#514acb;box-shadow:0 0 0 3px #efeeff}.member.ordered:after{content:"✓";margin-left:6px;color:var(--ok)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.choice{min-height:48px;border:1px solid var(--line);background:#fff;border-radius:13px;font-weight:850}.choice.active{background:var(--soft);border-color:#aaa6ff;color:#514acb}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;cursor:pointer}.menu.active{border-color:#aaa6ff;background:#f7f7ff;box-shadow:0 0 0 3px #efeeff}.menu b{display:block}.menu span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.input{width:100%;border:1px solid #dfe2e9;border-radius:12px;padding:12px 13px;outline:none;background:#fff}.input:focus{border-color:#a8a3ff;box-shadow:0 0 0 3px #efeeff}.save-order{width:100%;margin-top:16px;min-height:50px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#f8f9fb;border:1px solid var(--line);border-radius:14px;text-align:center;padding:11px}.stat strong{font-size:21px;display:block}.stat span{font-size:12px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;font-weight:800;background:#f1f0ff;color:#554ed0;padding:6px 9px;border-radius:999px}
.order{display:grid;grid-template-columns:38px 85px 1fr auto;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f1f4}.avatar{width:34px;height:34px;border-radius:11px;background:#efefff;color:#554ed0;display:grid;place-items:center;font-weight:900}.person{font-weight:850}.dish{font-size:14px}.note{font-size:12px;color:var(--muted);margin-top:2px}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px}.eat{background:#e9f8f0;color:#177f52}.skip{background:#fff0f0;color:#c94949}.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;background:#f8f9fb;border:1px solid var(--line);border-radius:14px;padding:13px}.total span{color:var(--muted);font-size:13px}.total strong{font-size:19px}
.admin{margin-top:18px}.hidden{display:none!important}.admin-top{display:grid;grid-template-columns:210px 1fr 150px auto;gap:9px;align-items:end}.divider{height:1px;background:var(--line);margin:24px 0}.manage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.manage-head h3{margin:0;font-size:18px}.manage-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.member-admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.member-admin{display:grid;grid-template-columns:1fr auto auto;gap:6px;background:#fafbfe;border:1px solid var(--line);border-radius:13px;padding:8px}.member-admin input{min-width:0;border:0;background:transparent;font-weight:800;outline:none}
.restaurant-block{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;background:#fbfcff}.restaurant-row{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:7px}.menu-edit{display:grid;grid-template-columns:1fr 110px auto auto;gap:7px;margin-top:7px}.mini{padding:8px 10px;border-radius:10px;font-size:12px}.addline{margin-top:9px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:20;box-shadow:0 12px 28px #0003}
.empty{padding:18px 0;color:#9aa2b0;text-align:center;font-size:13px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.admin-top{grid-template-columns:1fr 1fr}.admin-top .btn{grid-column:1/-1}.member-admin-grid{grid-template-columns:1fr 1fr}.restaurant-row{grid-template-columns:1fr 1fr}.menu-edit{grid-template-columns:1fr 100px auto}}
@media(max-width:560px){.shell{padding:14px 12px 34px}.top{align-items:flex-start}.brand h1{font-size:22px}.brand p{font-size:12px}.logo{width:42px;height:42px;border-radius:14px}.btn-light{padding:10px 11px;font-size:13px}.hero{padding:19px 17px;border-radius:20px}.hero h2{font-size:24px}.hero p{font-size:13px}.cutoff{min-width:92px;padding:10px}.cutoff strong{font-size:20px}.card{padding:16px;border-radius:18px}.member-grid{grid-template-columns:repeat(2,1fr)}.member{min-height:50px;font-size:15px}.menu-grid{grid-template-columns:1fr}.order{grid-template-columns:34px 70px 1fr}.order .status{grid-column:3;justify-self:start}.member-admin-grid{grid-template-columns:1fr}.admin-top{grid-template-columns:1fr}.restaurant-row,.menu-edit{grid-template-columns:1fr}.manage-head{align-items:flex-start;flex-direction:column}.manage-head .btn{width:100%}.toast{left:12px;right:12px;bottom:12px;text-align:center}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo">🍚</div><div><h1>오늘 저녁 주문</h1><p id="dateText"></p></div></div>
  <button class="btn btn-light" id="adminToggle">⚙️ 밥 당번</button>
</header>
<div id="banner" class="banner hidden"></div>
<section class="hero">
  <div><small>오늘의 식당</small><h2 id="restaurantName">불러오는 중...</h2><p id="restaurantDesc"></p></div>
  <div class="cutoff"><span>주문 마감</span><strong id="cutoffView">--:--</strong></div>
</section>

<main class="grid">
<section class="card">
  <div class="head"><h3>내 주문</h3><span class="pill" id="myState">이름 선택</span></div>
  <label class="label">① 내 이름 선택</label>
  <div id="memberGrid" class="member-grid"><div class="empty">등록된 사용자가 없습니다.</div></div>
  <div class="switch">
    <button class="choice active" id="eatBtn">🍽️ 먹을게요</button>
    <button class="choice" id="skipBtn">🙅 안 먹어요</button>
  </div>
  <div id="menuArea">
    <label class="label">② 메뉴 선택</label>
    <div id="menuGrid" class="menu-grid"></div>
    <label class="label">요청사항 <span style="color:#9aa2b0;font-weight:500">(선택)</span></label>
    <input class="input" id="noteInput" maxlength="100" placeholder="예: 밥 조금, 맵지 않게">
  </div>
  <button class="btn btn-primary save-order" id="saveBtn">주문 저장하기</button>
</section>

<section class="card">
  <div class="head"><h3>오늘 주문 현황</h3><span class="pill" id="respondCount">0명 응답</span></div>
  <div class="stats"><div class="stat"><strong id="eatCount">0</strong><span>식사</span></div><div class="stat"><strong id="skipCount">0</strong><span>미식사</span></div><div class="stat"><strong id="menuKinds">0</strong><span>메뉴 종류</span></div></div>
  <div class="chips" id="menuSummary"></div>
  <div id="orders"></div>
  <div class="total"><span>예상 주문 금액</span><strong id="totalPrice">0원</strong></div>
</section>
</main>

<section class="card admin hidden" id="adminPanel">
  <div class="head"><div><h3>밥 당번 관리</h3><p style="margin:4px 0 0;color:var(--muted);font-size:13px">PIN 0523 인증 후 사용자·식당·메뉴를 관리합니다.</p></div><span class="pill">관리자</span></div>
  <div class="admin-top">
    <div><label class="label">관리자 PIN</label><input class="input" id="pinInput" type="password" inputmode="numeric" placeholder="PIN"></div>
    <div><label class="label">오늘의 식당</label><select class="input" id="restaurantSelect"></select></div>
    <div><label class="label">주문 마감</label><input class="input" id="cutoffInput" type="time" value="17:40"></div>
    <button class="btn btn-primary" id="applyDayBtn">오늘 식당 적용</button>
  </div>

  <div class="divider"></div>
  <div class="manage-head"><div><h3>사용자 관리</h3><p>직원 이름을 미리 등록하면 주문자는 이름 버튼만 누르면 됩니다.</p></div><button class="btn btn-light" id="addMemberBtn">+ 사용자 추가</button></div>
  <div id="memberAdminGrid" class="member-admin-grid"></div>

  <div class="divider"></div>
  <div class="manage-head"><div><h3>식당 및 메뉴 관리</h3><p>식당명, 설명, 메뉴명과 가격을 수정할 수 있습니다.</p></div><button class="btn btn-light" id="addRestaurantBtn">+ 식당 추가</button></div>
  <div id="restaurantEditor"></div>
</section>
</div>
<div id="toast" class="toast"></div>

<script type="module">
const SUPABASE_URL="https://zyuybhszykxuafzriksn.supabase.co";
const KEY="sb_publishable_3h3_2LRYgdyeXdoDO6XZMA_4jQrQTtV";
const API=`${SUPABASE_URL}/functions/v1/meal-api`;
const $=s=>document.querySelector(s);
const st={restaurants:[],menus:[],members:[],day:null,orders:[],member:null,menu:null,eat:true};
function dateKey(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t)?.value;return `${g("year")}-${g("month")}-${g("day")}`}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",2200)}
function pin(){return $("#pinInput").value.trim()}
function token(name){const k=`meal-token:${dateKey()}:${name}`;let v=localStorage.getItem(k);if(!v){v=crypto.randomUUID();localStorage.setItem(k,v)}return v}
async function api(body=null){const isGet=!body;const url=isGet?API+`?date=${dateKey()}`:API;const r=await fetch(url,{method:isGet?"GET":"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:isGet?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||"오류");e.status=r.status;throw e}return d}
const activeR=()=>st.restaurants.filter(x=>x.active!==false), activeM=()=>st.menus.filter(x=>x.active!==false), activeU=()=>st.members.filter(x=>x.active!==false);
const restaurant=()=>st.restaurants.find(x=>x.id===st.day?.restaurant_id);
function render(){
 const r=restaurant();$("#restaurantName").textContent=r?.name||"오늘의 식당 미지정";$("#restaurantDesc").textContent=r?.description||"밥 당번이 식당을 지정해 주세요.";$("#cutoffView").textContent=st.day?.cutoff_time?.slice(0,5)||"--:--";
 $("#restaurantSelect").innerHTML=activeR().map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");if(st.day?.restaurant_id)$("#restaurantSelect").value=st.day.restaurant_id;if(st.day?.cutoff_time)$("#cutoffInput").value=st.day.cutoff_time.slice(0,5);
 const ordered=new Set(st.orders.map(o=>o.member_name));
 $("#memberGrid").innerHTML=activeU().length?activeU().map(u=>`<button class="member ${st.member===u.name?"active":""} ${ordered.has(u.name)?"ordered":""}" data-member="${esc(u.name)}">${esc(u.name)}</button>`).join(""):'<div class="empty">밥 당번이 사용자를 등록해 주세요.</div>';
 const menus=r?activeM().filter(m=>m.restaurant_id===r.id):[];$("#menuGrid").innerHTML=menus.length?menus.map(m=>`<button class="menu ${st.menu===m.id?"active":""}" data-menu="${m.id}"><b>${esc(m.name)}</b><span>${money(m.price)}</span></button>`).join(""):'<div class="empty">메뉴가 없습니다.</div>';
 $("#myState").textContent=st.member?st.member:"이름 선택";
 renderOrders();renderAdmin();
}
function renderOrders(){const mm=new Map(st.menus.map(m=>[m.id,m])),e=st.orders.filter(o=>o.will_eat),s=st.orders.filter(o=>!o.will_eat),cnt={};e.forEach(o=>{const n=mm.get(o.menu_id)?.name||"메뉴";cnt[n]=(cnt[n]||0)+1});$("#respondCount").textContent=st.orders.length+"명 응답";$("#eatCount").textContent=e.length;$("#skipCount").textContent=s.length;$("#menuKinds").textContent=Object.keys(cnt).length;$("#menuSummary").innerHTML=Object.entries(cnt).map(([n,c])=>`<span class="chip">${esc(n)} × ${c}</span>`).join("");$("#totalPrice").textContent=money(e.reduce((a,o)=>a+(mm.get(o.menu_id)?.price||0),0));$("#orders").innerHTML=st.orders.length?st.orders.map(o=>{const m=mm.get(o.menu_id);return `<div class="order"><div class="avatar">${esc(o.member_name.slice(0,1))}</div><div class="person">${esc(o.member_name)}</div><div>${o.will_eat?`<div class="dish">${esc(m?.name||"메뉴")}</div>${o.note?`<div class="note">${esc(o.note)}</div>`:""}`:'<div class="dish" style="color:#c94949">오늘은 안 먹음</div>'}</div><span class="status ${o.will_eat?"eat":"skip"}">${o.will_eat?"주문":"미식사"}</span></div>`}).join(""):'<div class="empty">아직 주문이 없습니다.</div>'}
function renderAdmin(){
 $("#memberAdminGrid").innerHTML=activeU().map(u=>`<div class="member-admin"><input data-uname="${u.id}" value="${esc(u.name)}"><button class="btn btn-light mini" data-usave="${u.id}">저장</button><button class="btn btn-danger mini" data-udel="${u.id}">삭제</button></div>`).join("")||'<div class="empty">등록된 사용자가 없습니다.</div>';
 $("#restaurantEditor").innerHTML=activeR().map(r=>{const ms=activeM().filter(m=>m.restaurant_id===r.id);return `<div class="restaurant-block"><div class="restaurant-row"><input class="input" data-rname="${r.id}" value="${esc(r.name)}"><input class="input" data-rdesc="${r.id}" value="${esc(r.description||"")}" placeholder="설명"><button class="btn btn-light mini" data-rsave="${r.id}">저장</button><button class="btn btn-danger mini" data-rdel="${r.id}">삭제</button></div>${ms.map(m=>`<div class="menu-edit"><input class="input" data-mname="${m.id}" value="${esc(m.name)}"><input class="input" data-mprice="${m.id}" type="number" value="${m.price}"><button class="btn btn-light mini" data-msave="${m.id}">저장</button><button class="btn btn-danger mini" data-mdel="${m.id}">삭제</button></div>`).join("")}<button class="btn btn-light mini addline" data-madd="${r.id}">+ 메뉴 추가</button></div>`}).join("")}
async function refresh(silent=false){try{const d=await api();Object.assign(st,{restaurants:d.restaurants||[],menus:d.menus||[],members:d.members||[],day:d.day||null,orders:d.orders||[]});if(st.member&&!activeU().some(u=>u.name===st.member))st.member=null;render();$("#banner").classList.add("hidden")}catch(e){$("#banner").textContent="데이터 연결 오류: "+e.message;$("#banner").classList.remove("hidden");if(!silent)toast("데이터 연결을 확인해 주세요.")}}
async function admin(body,msg){if(!pin())return toast("관리자 PIN을 입력해 주세요.");try{await api({...body,pin:pin()});toast(msg);await refresh(true);return true}catch(e){toast(e.message==="invalid_admin_pin"?"PIN이 올바르지 않습니다.":e.message==="member_name_exists"?"이미 등록된 이름입니다.":"처리 실패: "+e.message);return false}}
$("#memberGrid").onclick=e=>{const b=e.target.closest("[data-member]");if(!b)return;st.member=b.dataset.member;localStorage.setItem("meal-last-member",st.member);render()};
$("#menuGrid").onclick=e=>{const b=e.target.closest("[data-menu]");if(!b)return;st.menu=b.dataset.menu;render()};
$("#eatBtn").onclick=()=>{st.eat=true;$("#eatBtn").classList.add("active");$("#skipBtn").classList.remove("active");$("#menuArea").classList.remove("hidden")};
$("#skipBtn").onclick=()=>{st.eat=false;$("#skipBtn").classList.add("active");$("#eatBtn").classList.remove("active");$("#menuArea").classList.add("hidden")};
$("#saveBtn").onclick=async()=>{if(!st.member)return toast("먼저 내 이름을 선택해 주세요.");if(!st.day)return toast("오늘의 식당이 정해지지 않았습니다.");if(st.eat&&!st.menu)return toast("메뉴를 선택해 주세요.");try{await api({action:"submit_order",date:dateKey(),name:st.member,will_eat:st.eat,menu_id:st.eat?st.menu:null,note:$("#noteInput").value.trim(),token:token(st.member)});toast("주문이 저장되었습니다.");await refresh(true)}catch(e){toast(e.status===409?"같은 이름의 주문이 다른 기기에서 이미 등록되었습니다.":"저장 실패: "+e.message)}};
$("#adminToggle").onclick=()=>$("#adminPanel").classList.toggle("hidden");
$("#applyDayBtn").onclick=()=>admin({action:"admin_set_day",date:dateKey(),restaurant_id:$("#restaurantSelect").value,cutoff_time:$("#cutoffInput").value||"17:40"},"오늘의 식당을 적용했습니다.");
$("#addMemberBtn").onclick=async()=>{const n=prompt("추가할 사용자 이름을 입력하세요.");if(n)await admin({action:"admin_add_member",name:n},"사용자를 추가했습니다.")};
$("#addRestaurantBtn").onclick=async()=>{const n=prompt("식당 이름을 입력하세요.");if(!n)return;const d=prompt("식당 설명을 입력하세요.")||"";await admin({action:"admin_add_restaurant",name:n,description:d},"식당을 추가했습니다.")};
$("#memberAdminGrid").onclick=async e=>{const t=e.target;if(t.dataset.usave){const id=t.dataset.usave,n=document.querySelector(`[data-uname="${id}"]`).value.trim();await admin({action:"admin_update_member",id,name:n},"사용자 이름을 저장했습니다.")}if(t.dataset.udel&&confirm("이 사용자를 목록에서 삭제할까요?"))await admin({action:"admin_delete_member",id:t.dataset.udel},"사용자를 삭제했습니다.")};
$("#restaurantEditor").onclick=async e=>{const t=e.target;if(t.dataset.rsave){const id=t.dataset.rsave;await admin({action:"admin_update_restaurant",id,name:document.querySelector(`[data-rname="${id}"]`).value.trim(),description:document.querySelector(`[data-rdesc="${id}"]`).value.trim()},"식당 정보를 저장했습니다.")}if(t.dataset.rdel&&confirm("식당을 삭제할까요?"))await admin({action:"admin_delete_restaurant",id:t.dataset.rdel},"식당을 삭제했습니다.");if(t.dataset.msave){const id=t.dataset.msave;await admin({action:"admin_update_menu",id,name:document.querySelector(`[data-mname="${id}"]`).value.trim(),price:Number(document.querySelector(`[data-mprice="${id}"]`).value||0)},"메뉴를 저장했습니다.")}if(t.dataset.mdel&&confirm("메뉴를 삭제할까요?"))await admin({action:"admin_delete_menu",id:t.dataset.mdel},"메뉴를 삭제했습니다.");if(t.dataset.madd){const n=prompt("메뉴 이름을 입력하세요.");if(!n)return;const p=Number(prompt("가격을 입력하세요.","9000")||0);await admin({action:"admin_add_menu",restaurant_id:t.dataset.madd,name:n,price:p},"메뉴를 추가했습니다.")}};
$("#dateText").textContent=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
st.member=localStorage.getItem("meal-last-member")||null;
await refresh();
setInterval(()=>refresh(true),5000);
</script>
</body>
</html>
